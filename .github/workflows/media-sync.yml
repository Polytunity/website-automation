name: Squarespace → Notion Media & Uptake Sync

on:
  # Runs every day at 8:00 AM UTC
  schedule:
    - cron: "0 8 * * *"

  # Allows you to trigger the sync manually from the GitHub Actions tab
  # useful for testing or forcing a sync after a big glossary update
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run media & uptake sync
        env:
          NOTION_MEDIA_KEY: ${{ secrets.NOTION_MEDIA_KEY }}
          SQUARESPACE_URL: ${{ secrets.SQUARESPACE_URL }}
          NOTION_MEDIA_DB_ID: ${{ secrets.NOTION_MEDIA_DB_ID }}
        run: node scripts/media-sync/media-sync.js